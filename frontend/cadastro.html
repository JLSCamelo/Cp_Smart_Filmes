<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Cine Henrique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo" id="navbar"></header>

  <main>
    <div class="card-form">
      <h1>Criar conta</h1>
      <div id="mensagem" class="mensagem" style="display: none"></div>
      <form id="form-cadastro">
        <div>
          <label for="nome">Nome</label>
          <input type="text" id="nome" required />
        </div>
        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" required />
        </div>
        <div>
          <label for="senha">Senha</label>
          <input type="password" id="senha" minlength="6" required />
        </div>
        <button type="submit" class="btn-primario">Cadastrar</button>
      </form>
      <p class="link-alternativo">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    montarNavbar("navbar");

    document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
      e.preventDefault();
      mostrarMensagem("mensagem", "");

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      try {
        await apiFetch("/auth/registrar", {
          method: "POST",
          body: JSON.stringify({ nome, email, senha }),
        });
        mostrarMensagem("mensagem", "Conta criada com sucesso! Redirecionando para o login...", "sucesso");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (erro) {
        mostrarMensagem("mensagem", erro.message);
      }
    });
  </script>
</body>
</html>
